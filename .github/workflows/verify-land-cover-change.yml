name: Verify Land Cover Change

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline year
        required: true
        default: "2020"
      year:
        description: Comparison year
        required: true
        default: "2025"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-land-cover-change.yml"
      - "scripts/verify-land-cover-change.mjs"
      - "src/app/api/land-cover-change/**"
      - "src/lib/gee.ts"
      - "src/lib/land-cover.ts"

permissions:
  contents: read

jobs:
  verify:
    name: Run live GEE verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
      LAND_COVER_BASELINE: ${{ github.event.inputs.baseline || '2020' }}
      LAND_COVER_YEAR: ${{ github.event.inputs.year || '2025' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        shell: bash
        run: |
          npm run dev > /tmp/land-cover-next.log 2>&1 &
          echo $! > /tmp/land-cover-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/land-cover-next.log
          exit 1

      - name: Verify live Dynamic World response
        run: node scripts/verify-land-cover-change.mjs

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/land-cover-next.log
