name: Export Verified District Metrics Snapshot

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated years"
        required: true
        default: "2018,2024,2025"

jobs:
  export:
    name: Compute verified district snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/gee/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/gee/requirements.txt

      - name: Compute snapshot
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: >-
          python scripts/gee/export-district-metrics-snapshot.py
          --years "${{ inputs.years }}"
          --output artifacts/district-metrics-verified.json

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: district-metrics-verified
          path: artifacts/district-metrics-verified.json
          if-no-files-found: error
          retention-days: 7
