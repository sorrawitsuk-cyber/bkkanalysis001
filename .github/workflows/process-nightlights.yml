name: Process Nighttime Lights Cache

# Computes VIIRS DNB annual/monthly products once in GEE, uploads the preview,
# GeoTIFF, and district statistics to Cloudflare R2. The app reads R2 by default.

on:
  schedule:
    # Annual product: process previous full year around late January.
    - cron: '30 23 25 1 *'
    # Monthly preview: try monthly after likely VIIRS catalog updates.
    - cron: '30 22 10 * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'yearly or monthly'
        required: true
        default: 'yearly'
      year:
        description: 'Annual year YYYY, used when type=yearly'
        required: false
        default: ''
      period:
        description: 'Monthly period YYYY-MM, used when type=monthly'
        required: false
        default: ''
      force_reprocess:
        description: 'Force reprocess even if metadata already exists (true/false)'
        required: false
        default: 'false'

jobs:
  process:
    name: Process VIIRS nightlights
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/gee/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/gee/requirements.txt

      - name: Build run arguments
        id: args
        shell: bash
        run: |
          TYPE="${{ github.event.inputs.type }}"
          if [ -z "$TYPE" ]; then
            # Scheduled runs in January produce yearly; monthly schedule otherwise.
            if [ "$(date -u +%m)" = "01" ]; then TYPE="yearly"; else TYPE="monthly"; fi
          fi

          ARGS="--type $TYPE"
          if [ "$TYPE" = "yearly" ] && [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          fi
          if [ "$TYPE" = "monthly" ] && [ -n "${{ github.event.inputs.period }}" ]; then
            ARGS="$ARGS --period ${{ github.event.inputs.period }}"
          fi
          if [ "${{ github.event.inputs.force_reprocess }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Running with args: $ARGS"

      - name: Run nighttime lights processing
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID:            ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:         ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:     ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:                ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL:       ${{ secrets.R2_PUBLIC_BASE_URL }}
          SATELLITE_CACHE_PREFIX:   ${{ vars.SATELLITE_CACHE_PREFIX || 'satellite-cache' }}
          FORCE_REPROCESS:          ${{ github.event.inputs.force_reprocess || 'false' }}
        run: python scripts/gee/process-nightlights.py ${{ steps.args.outputs.args }}
