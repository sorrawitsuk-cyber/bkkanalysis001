name: Patch District Stats in R2 Cache

# Lightweight: adds district_stats (water_ratio, ndwi_mean, mndwi_mean) to existing
# R2 metadata.json files WITHOUT re-exporting TIF/WebP rasters.
# Much faster than full reprocess (~3–5 min per year vs 15–30 min per year).

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Single year to patch YYYY (leave blank for all years in index)'
        required: false
        default: ''
      force:
        description: 'Overwrite even if district_stats already present (true/false)'
        required: false
        default: 'false'

jobs:
  patch:
    name: Patch district stats${{ github.event.inputs.year && format(' — {0}', github.event.inputs.year) || ' — all years' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/gee/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/gee/requirements.txt

      - name: Build run arguments
        id: args
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run patch script
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID:            ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:         ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:     ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:                ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL:       ${{ secrets.R2_PUBLIC_BASE_URL }}
          SATELLITE_CACHE_PREFIX:   ${{ vars.SATELLITE_CACHE_PREFIX || 'satellite-cache' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_PATCH:              ${{ github.event.inputs.force || 'false' }}
        run: python scripts/gee/patch-district-stats.py ${{ steps.args.outputs.args }}
