name: Observatory Quality Gates

on:
  pull_request:
    paths:
      - ".github/workflows/observatory-quality.yml"
      - "config/observatory/**"
      - "docs/observatory-rd.md"
      - "fixtures/observatory/**"
      - "scripts/observatory/**"
      - "reports/observatory/**"
      - "src/app/api/v1/**"
      - "src/app/areas/**"
      - "src/app/evidence/**"
      - "src/app/observatory/**"
      - "src/components/observatory/**"
      - "src/data/observatory/**"
      - "src/lib/observatory/**"
      - "supabase/migrations/015_observatory_v2_core.sql"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/observatory-quality.yml"
      - "config/observatory/**"
      - "fixtures/observatory/**"
      - "scripts/observatory/**"
      - "reports/observatory/**"
      - "src/app/api/v1/**"
      - "src/components/observatory/**"
      - "src/data/observatory/**"
      - "src/lib/observatory/**"
      - "supabase/migrations/015_observatory_v2_core.sql"

permissions:
  contents: read

concurrency:
  group: observatory-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Registry, contracts, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify offline product recipes
        run: npm run observatory:recipes

      - name: Validate evidence registry
        run: npm run observatory:validate

      - name: Verify API and data contracts
        run: npm run observatory:contracts

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint Observatory scope
        run: npm run lint:observatory

      - name: Build Next.js application
        run: npm run build:next
