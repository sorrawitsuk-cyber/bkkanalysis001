name: Process Nighttime Lights — All Years

# Batch workflow: processes all annual VIIRS composites in parallel.
# Use this to backfill all years or re-run when the methodology changes.
# Monthly periods must still be run one at a time via process-nightlights.yml.

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'First year to process (default: 2013)'
        required: false
        default: '2013'
      end_year:
        description: 'Last year to process (default: previous calendar year)'
        required: false
        default: ''
      force_reprocess:
        description: 'Reprocess even if metadata already exists (true/false)'
        required: false
        default: 'false'

jobs:
  # ── Step 1: build the year matrix ─────────────────────────────────────────
  build-matrix:
    name: Build year list
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.gen.outputs.years }}

    steps:
      - name: Generate year list
        id: gen
        run: |
          START="${{ github.event.inputs.start_year || '2013' }}"
          END="${{ github.event.inputs.end_year }}"
          if [ -z "$END" ]; then
            END=$(date -u +%Y)
            END=$((END - 1))
          fi
          YEARS=$(python3 -c "import json; print(json.dumps(list(range(int('$START'), int('$END') + 1))))")
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"
          echo "Processing years: $YEARS"

  # ── Step 2: process each year in parallel ─────────────────────────────────
  process-year:
    name: Year ${{ matrix.year }}
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        year: ${{ fromJson(needs.build-matrix.outputs.years) }}
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/gee/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/gee/requirements.txt

      - name: Process ${{ matrix.year }}
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID:            ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:         ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:     ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:                ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL:       ${{ secrets.R2_PUBLIC_BASE_URL }}
          SATELLITE_CACHE_PREFIX:   ${{ vars.SATELLITE_CACHE_PREFIX || 'satellite-cache' }}
          FORCE_REPROCESS:          ${{ github.event.inputs.force_reprocess || 'false' }}
        run: |
          ARGS="--type yearly --year ${{ matrix.year }}"
          if [ "${{ github.event.inputs.force_reprocess }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/gee/process-nightlights.py $ARGS
